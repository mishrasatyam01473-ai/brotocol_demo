<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta name="description" content="Welcome to The Food Court. Access our digital menu, customer reviews, and official social media." />
  <title>THE FOOD COURT | Guest Portal</title>

  <!-- Performance: Resource Hints & DNS Prefetch -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://www.instagram.com">
  <link rel="dns-prefetch" href="https://search.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Performance: Preload Critical Assets -->
  <link rel="preload" as="image" href="/restaurant_banner.jpg" fetchpriority="high">
  <link rel="preload" as="image" href="/menu.jpg" fetchpriority="low">

  <!-- Performance: Google Fonts (Outfit & Plus Jakarta Sans) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
